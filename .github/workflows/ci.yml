name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URI: mongodb://localhost:27017/splitwise-test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-only
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: splitwise-clone/package-lock.json

      - name: Install dependencies
        working-directory: splitwise-clone
        run: npm ci

      - name: Run tests
        working-directory: splitwise-clone
        run: npm test -- --forceExit --detectOpenHandles

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: splitwise-clone
        run: docker build -t splitwise-clone:${{ github.sha }} .

      - name: Verify Docker image
        run: docker images splitwise-clone:${{ github.sha }}
