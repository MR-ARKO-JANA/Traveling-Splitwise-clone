<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitwise - Groups</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
.groups-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px;
}

.groups-header {
    text-align: center;
    margin-bottom: 40px;
}

.groups-header h1 {
    font-size: 36px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 25px;
    margin-bottom: 40px;
}

.group-card {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
    cursor: pointer;
}

.group-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.group-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
}

.group-info h3 {
    color: #fff;
    font-size: 20px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.group-info p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    line-height: 1.4;
}

.group-actions {
    display: flex;
    gap: 8px;
}

.group-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 8px 12px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.3s ease;
}

.group-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.group-btn.primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
}

.group-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat-item {
    text-align: center;
    padding: 15px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
}

.stat-item .number {
    font-size: 24px;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 5px;
}

.stat-item .label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
}

.group-members {
    margin-bottom: 20px;
}

.group-members h4 {
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.members-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.member-tag {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.9);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.group-balance {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    margin-bottom: 15px;
}

.balance-info {
    display: flex;
    flex-direction: column;
}

.balance-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 5px;
}

.balance-amount {
    font-size: 18px;
    font-weight: bold;
}

.balance-amount.positive {
    color: #00e676;
}

.balance-amount.negative {
    color: #ff5252;
}

.balance-amount.neutral {
    color: #ffd54f;
}

.create-group-card {
    background: rgba(255, 255, 255, 0.05);
    border: 2px dashed rgba(255, 255, 255, 0.3);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
}

.create-group-card:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #667eea;
    transform: translateY(-5px);
}

.create-group-card i {
    font-size: 48px;
    color: #667eea;
    margin-bottom: 20px;
}

.create-group-card h3 {
    color: #fff;
    margin-bottom: 10px;
}

.create-group-card p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
}

.back-btn {
    position: fixed;
    top: 30px;
    left: 30px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
}

/* Modal styles */
.modal {
    display: none;
    position: fixed;
    z-index: 10000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
}

.modal-content {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    margin: 10% auto;
    padding: 30px;
    border-radius: 20px;
    width: 90%;
    max-width: 600px;
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    max-height: 80vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.close {
    color: rgba(255,255,255,0.7);
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    line-height: 1;
}

.close:hover {
    color: white;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    transition: 0.3s ease;
    backdrop-filter: blur(10px);
    font-family: inherit;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-color: #667eea;
    box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
}

.modal-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.btn {
    flex: 1;
    padding: 12px 24px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}

.btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.btn:hover {
    transform: scale(1.05);
}

.member-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    margin-bottom: 10px;
}

.member-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.member-avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-size: 14px;
}

.remove-member-btn {
    background: #ff5252;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 12px;
}

.remove-member-btn:hover {
    background: #ff1744;
}
</style>
</head>
<body>

<button class="back-btn" onclick="window.history.back()">
    <i class="fas fa-arrow-left"></i> Back to Dashboard
</button>

<div class="groups-container">
    <div class="groups-header">
        <h1><i class="fas fa-users"></i> Your Groups</h1>
        <p style="color: rgba(255,255,255,0.7);">Manage your expense groups and track spending with friends</p>
    </div>

    <div class="groups-grid" id="groupsGrid">
        <!-- Create new group card -->
        <div class="create-group-card" onclick="showCreateGroupModal()">
            <i class="fas fa-plus-circle"></i>
            <h3>Create New Group</h3>
            <p>Start splitting expenses with friends</p>
        </div>
        
        <!-- Groups will be loaded here -->
    </div>
</div>

<!-- Create Group Modal -->
<div id="createGroupModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-users"></i> Create New Group</h2>
            <span class="close" onclick="hideModal('createGroupModal')">&times;</span>
        </div>
        
        <form id="createGroupForm">
            <div class="form-group">
                <label for="groupName">Group Name *</label>
                <input type="text" id="groupName" placeholder="e.g., Weekend Trip, Roommates, Office Lunch" maxlength="50" required>
            </div>
            
            <div class="form-group">
                <label for="groupDescription">Description</label>
                <textarea id="groupDescription" placeholder="What's this group for?" rows="3" maxlength="200"></textarea>
            </div>
            
            <div class="form-group">
                <label for="memberEmails">Add Members (Email addresses)</label>
                <input type="text" id="memberEmails" placeholder="friend1@email.com, friend2@email.com">
                <small style="color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 5px; display: block;">
                    Separate multiple emails with commas. You'll be added automatically.
                </small>
            </div>
        </form>
        
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="hideModal('createGroupModal')">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="createGroup()">
                <i class="fas fa-plus"></i> Create Group
            </button>
        </div>
    </div>
</div>

<!-- Group Details Modal -->
<div id="groupDetailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="groupDetailsTitle"><i class="fas fa-users"></i> Group Details</h2>
            <span class="close" onclick="hideModal('groupDetailsModal')">&times;</span>
        </div>
        
        <div id="groupDetailsContent">
            <!-- Group details will be loaded here -->
        </div>
        
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="hideModal('groupDetailsModal')">Close</button>
            <button type="button" class="btn btn-primary" onclick="editGroup()">
                <i class="fas fa-edit"></i> Edit Group
            </button>
        </div>
    </div>
</div>

<!-- Add Member Modal -->
<div id="addMemberModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-user-plus"></i> Add Member</h2>
            <span class="close" onclick="hideModal('addMemberModal')">&times;</span>
        </div>
        
        <div class="form-group">
            <label for="newMemberEmail">Email Address</label>
            <input type="email" id="newMemberEmail" placeholder="friend@email.com">
        </div>
        
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="hideModal('addMemberModal')">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="addMember()">
                <i class="fas fa-plus"></i> Add Member
            </button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
// Check authentication
const token = localStorage.getItem("token");
if (!token) {
    window.location.href = "index.html";
}

const headers = {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
};

let currentGroups = [];
let selectedGroupId = null;

// Load groups
async function loadGroups() {
    try {
        const groups = await api.groups.getAll();
        currentGroups = groups;
        
        renderGroups(groups);
    } catch (err) {
        console.error("Error loading groups:", err);
        showNotification(err.message || "Failed to load groups", "error");
    }
}

// Render groups
function renderGroups(groups) {
    const grid = document.getElementById("groupsGrid");
    
    // Keep the create group card and clear the rest
    const createCard = grid.querySelector('.create-group-card');
    grid.innerHTML = '';
    grid.appendChild(createCard);
    
    if (groups.length === 0) {
        const emptyState = document.createElement('div');
        emptyState.style.gridColumn = '1 / -1';
        emptyState.style.textAlign = 'center';
        emptyState.style.padding = '60px 20px';
        emptyState.style.color = 'rgba(255,255,255,0.6)';
        emptyState.innerHTML = `
            <i class="fas fa-users" style="font-size: 64px; margin-bottom: 20px; opacity: 0.3;"></i>
            <h3 style="margin-bottom: 10px;">No groups yet</h3>
            <p>Create your first group to start splitting expenses with friends!</p>
        `;
        grid.appendChild(emptyState);
        return;
    }
    
    groups.forEach(group => {
        const groupCard = createGroupCard(group);
        grid.appendChild(groupCard);
    });
}

// Create group card element
function createGroupCard(group) {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.onclick = () => showGroupDetails(group._id);
    
    const memberCount = group.members ? group.members.length : 0;
    const membersList = group.members ? group.members.slice(0, 3) : [];
    const moreMembers = memberCount > 3 ? `+${memberCount - 3} more` : '';
    
    card.innerHTML = `
        <div class="group-card-header">
            <div class="group-info">
                <h3><i class="fas fa-users"></i> ${escapeHtml(group.name)}</h3>
                <p>${escapeHtml(group.description || 'No description')}</p>
            </div>
            <div class="group-actions" onclick="event.stopPropagation()">
                <button class="group-btn" onclick="showAddMemberModal('${group._id}')" title="Add Member">
                    <i class="fas fa-user-plus"></i>
                </button>
                <button class="group-btn primary" onclick="viewGroupExpenses('${group._id}')" title="View Expenses">
                    <i class="fas fa-receipt"></i>
                </button>
            </div>
        </div>
        
        <div class="group-stats">
            <div class="stat-item">
                <div class="number">${memberCount}</div>
                <div class="label">Members</div>
            </div>
            <div class="stat-item">
                <div class="number">0</div>
                <div class="label">Expenses</div>
            </div>
            <div class="stat-item">
                <div class="number">₹0</div>
                <div class="label">Total</div>
            </div>
        </div>
        
        <div class="group-members">
            <h4><i class="fas fa-user"></i> Members</h4>
            <div class="members-list">
                ${membersList.map(member => `
                    <span class="member-tag">${escapeHtml(member)}</span>
                `).join('')}
                ${moreMembers ? `<span class="member-tag">${moreMembers}</span>` : ''}
            </div>
        </div>
        
        <div class="group-balance">
            <div class="balance-info">
                <div class="balance-label">Your balance in this group</div>
                <div class="balance-amount neutral">₹0.00</div>
            </div>
            <i class="fas fa-balance-scale" style="color: rgba(255,255,255,0.3); font-size: 24px;"></i>
        </div>
    `;
    
    return card;
}

// Show create group modal
function showCreateGroupModal() {
    document.getElementById('createGroupModal').style.display = 'block';
    document.getElementById('groupName').focus();
}

// Hide modal
function hideModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

// Create group
async function createGroup() {
    const name = document.getElementById('groupName').value.trim();
    const description = document.getElementById('groupDescription').value.trim();
    const emails = document.getElementById('memberEmails').value.trim();
    
    if (!name) {
        showNotification('Please enter a group name', 'error');
        return;
    }
    
    const memberEmails = emails ? emails.split(',').map(email => email.trim()).filter(email => email) : [];
    
    // Validate emails
    for (const email of memberEmails) {
        if (!isValidEmail(email)) {
            showNotification(`Invalid email: ${email}`, 'error');
            return;
        }
    }
    
    try {
        const data = await api.groups.create(name, description, memberEmails);
        
        showNotification(`Group "${name}" created successfully!`, 'success');
        hideModal('createGroupModal');
        
        // Clear form
        document.getElementById('groupName').value = '';
        document.getElementById('groupDescription').value = '';
        document.getElementById('memberEmails').value = '';
        
        // Reload groups
        loadGroups();
    } catch (err) {
        console.error('Create group error:', err);
        showNotification(err.message || 'Failed to create group', 'error');
    }
}

// Show group details
async function showGroupDetails(groupId) {
    selectedGroupId = groupId;
    const group = currentGroups.find(g => g._id === groupId);
    
    if (!group) return;
    
    document.getElementById('groupDetailsTitle').innerHTML = `
        <i class="fas fa-users"></i> ${escapeHtml(group.name)}
    `;
    
    const content = document.getElementById('groupDetailsContent');
    content.innerHTML = `
        <div style="margin-bottom: 25px;">
            <h3 style="color: #fff; margin-bottom: 10px;">Description</h3>
            <p style="color: rgba(255,255,255,0.8);">${escapeHtml(group.description || 'No description provided')}</p>
        </div>
        
        <div style="margin-bottom: 25px;">
            <h3 style="color: #fff; margin-bottom: 15px;">Members (${group.members ? group.members.length : 0})</h3>
            <div id="membersList">
                ${group.members ? group.members.map(member => `
                    <div class="member-item">
                        <div class="member-info">
                            <div class="member-avatar">${member.charAt(0).toUpperCase()}</div>
                            <div>
                                <div style="color: #fff; font-weight: 500;">${escapeHtml(member)}</div>
                                <small style="color: rgba(255,255,255,0.6);">Member</small>
                            </div>
                        </div>
                        <button class="remove-member-btn" onclick="removeMember('${groupId}', '${member}')">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `).join('') : '<p style="color: rgba(255,255,255,0.6);">No members</p>'}
            </div>
        </div>
        
        <div>
            <h3 style="color: #fff; margin-bottom: 15px;">Group Statistics</h3>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; text-align: center;">
                    <div style="font-size: 24px; font-weight: bold; color: #667eea; margin-bottom: 5px;">0</div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.7);">Total Expenses</div>
                </div>
                <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; text-align: center;">
                    <div style="font-size: 24px; font-weight: bold; color: #667eea; margin-bottom: 5px;">₹0</div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.7);">Total Amount</div>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('groupDetailsModal').style.display = 'block';
}

// Show add member modal
function showAddMemberModal(groupId) {
    selectedGroupId = groupId;
    document.getElementById('addMemberModal').style.display = 'block';
    document.getElementById('newMemberEmail').focus();
}

// Add member
async function addMember() {
    const email = document.getElementById('newMemberEmail').value.trim();
    
    if (!email) {
        showNotification('Please enter an email address', 'error');
        return;
    }
    
    if (!isValidEmail(email)) {
        showNotification('Please enter a valid email address', 'error');
        return;
    }
    
    try {
        const data = await api.groups.addMember(selectedGroupId, email);
        
        showNotification('Member added successfully!', 'success');
        hideModal('addMemberModal');
        document.getElementById('newMemberEmail').value = '';
        loadGroups();
    } catch (err) {
        console.error('Add member error:', err);
        showNotification(err.message || 'Failed to add member', 'error');
    }
}

// Remove member
async function removeMember(groupId, memberEmail) {
    if (!confirm(`Remove ${memberEmail} from this group?`)) {
        return;
    }
    
    // This would need a backend endpoint to remove members
    showNotification('Remove member feature coming soon!', 'info');
}

// View group expenses
function viewGroupExpenses(groupId) {
    // Redirect to dashboard with selected group
    localStorage.setItem('selectedGroupId', groupId);
    window.location.href = 'dashboard.html';
}

// Edit group
function editGroup() {
    showNotification('Edit group feature coming soon!', 'info');
}

// Utility functions
function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 10px;
        z-index: 10000;
        font-weight: 500;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s ease;
        color: white;
    `;
    
    if (type === 'success') {
        notification.style.background = 'linear-gradient(135deg, #00e676, #43cea2)';
    } else if (type === 'error') {
        notification.style.background = 'linear-gradient(135deg, #ff5252, #dd2476)';
    } else {
        notification.style.background = 'linear-gradient(135deg, #2196f3, #21cbf3)';
    }
    
    notification.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
        ${message}
    `;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.remove();
    }, 4000);
}

// Close modals when clicking outside
window.onclick = function(event) {
    if (event.target.classList.contains('modal')) {
        event.target.style.display = 'none';
    }
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
    loadGroups();
});
</script>

</body>
</html>
