<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitwise - Analytics</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .analytics-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px;
      }

      .analytics-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .analytics-header h1 {
        font-size: 36px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 25px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
      }

      .stat-card h3 {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stat-card .value {
        font-size: 32px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 5px;
      }

      .stat-card .change {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }

      .charts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
        margin-bottom: 40px;
      }

      .chart-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 25px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .chart-card h3 {
        color: #fff;
        margin-bottom: 20px;
        text-align: center;
      }

      .chart-container {
        position: relative;
        height: 300px;
      }

      .navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      .nav-btn {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 25px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
      }

      .nav-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
      }

      .time-filter {
        display: flex;
        gap: 10px;
      }

      .filter-btn {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .filter-btn.active,
      .filter-btn:hover {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-color: transparent;
      }

      .expense-trends {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 25px;
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 30px;
      }

      .expense-trends h3 {
        color: #fff;
        margin-bottom: 20px;
      }

      .trend-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .trend-item:last-child {
        border-bottom: none;
      }

      .trend-category {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .trend-amount {
        font-weight: bold;
        color: #fff;
      }

      .trend-percentage {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 10px;
        margin-left: 10px;
      }

      .trend-percentage.increase {
        background: rgba(255, 82, 82, 0.2);
        color: #ff5252;
      }

      .trend-percentage.decrease {
        background: rgba(0, 230, 118, 0.2);
        color: #00e676;
      }
    </style>
  </head>
  <body>
    <div class="analytics-container">
      <div class="navigation">
        <a href="dashboard.html" class="nav-btn">
          <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
        <div class="time-filter">
          <button class="filter-btn active" data-period="7">7 Days</button>
          <button class="filter-btn" data-period="30">30 Days</button>
          <button class="filter-btn" data-period="90">3 Months</button>
          <button class="filter-btn" data-period="365">1 Year</button>
        </div>
      </div>

      <div class="analytics-header">
        <h1><i class="fas fa-chart-line"></i> Expense Analytics</h1>
        <p>Track your spending patterns and financial insights</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Expenses</h3>
          <div class="value" id="totalExpenses">₹0</div>
          <div class="change" id="expenseChange">This period</div>
        </div>
        <div class="stat-card">
          <h3>Average per Day</h3>
          <div class="value" id="avgPerDay">₹0</div>
          <div class="change" id="avgChange">Daily average</div>
        </div>
        <div class="stat-card">
          <h3>Groups Active</h3>
          <div class="value" id="activeGroups">0</div>
          <div class="change" id="groupChange">With expenses</div>
        </div>
        <div class="stat-card">
          <h3>Transactions</h3>
          <div class="value" id="totalTransactions">0</div>
          <div class="change" id="transactionChange">Total count</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3><i class="fas fa-pie-chart"></i> Expenses by Category</h3>
          <div class="chart-container">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3><i class="fas fa-line-chart"></i> Spending Trend</h3>
          <div class="chart-container">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>

      <div class="expense-trends">
        <h3><i class="fas fa-trending-up"></i> Category Breakdown</h3>
        <div id="categoryBreakdown">
          <!-- Category trends will be populated here -->
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/analytics.js"></script>
  </body>
</html>
