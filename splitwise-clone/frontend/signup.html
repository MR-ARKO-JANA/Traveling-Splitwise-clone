<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Splitwise | Signup</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* Custom styles for signup page with Fuji mountain background */
body {
    position: relative;
    min-height: 100vh;
}

.auth-container {
    position: relative;
    z-index: 2;
}

.auth-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Enhanced signup form styling */
.auth-card h2 {
    color: white;
    text-align: center;
    margin-bottom: 30px;
    font-size: 28px;
    font-weight: 600;
}

.auth-card input {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 15px 20px;
    border-radius: 12px;
    width: 100%;
    margin-bottom: 20px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.auth-card input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

.auth-card input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    border-color: #667eea;
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
}

.auth-card button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 25px;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 20px;
}

.auth-card button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.auth-card p {
    text-align: center;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 20px;
}

.auth-card p a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.auth-card p a:hover {
    color: #764ba2;
}

/* Loading state */
.loading {
    opacity: 0.7;
    pointer-events: none;
}

/* Success/Error messages */
.message {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 15px 20px;
    border-radius: 10px;
    z-index: 10000;
    font-weight: 500;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    animation: slideIn 0.3s ease;
    color: white;
    max-width: 300px;
}

.message.success {
    background: linear-gradient(135deg, #00e676, #43cea2);
}

.message.error {
    background: linear-gradient(135deg, #ff5252, #dd2476);
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card slide-in">
    <h2><i class="fas fa-user-plus"></i> Create Account</h2>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="password" id="password" placeholder="Password (min 6 characters)" required>
      <button type="submit">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <p>Already have an account? <a href="index.html"><i class="fas fa-sign-in-alt"></i> Login here</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/apiClient.js"></script>
<script src="js/uiUtils.js"></script>
<script src="js/authService.js"></script>
<script src="js/signup.js"></script>

<!-- Vanta.js Background setup -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    VANTA.WAVES({
      el: "body",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x5588
    })
  });
</script>
</body>
</html>
