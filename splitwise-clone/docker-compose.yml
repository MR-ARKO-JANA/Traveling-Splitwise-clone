services:
  app:
    build: .
    container_name: splitwise-clone-app
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_URI=mongodb://mongo:27017/splitwise-clone
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-strong-random-secret-in-production}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - app-uploads:/app/backend/uploads
    networks:
      - splitwise-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: splitwise-clone-redis
    ports:
      - '6379:6379'
    restart: unless-stopped
    networks:
      - splitwise-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  mongo:
    image: mongo:7
    container_name: splitwise-clone-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - splitwise-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  splitwise-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  app-uploads:
    driver: local
